[railway]
preset = "node"

[nixpacks]
node_version = "20"

[build]
builder = "nixpacks"
buildCommand = "VITE_API_URL=https://novel-admin-backend-production.up.railway.app npm install && npm run build"

[deploy]
healthCheckPath = "/"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
startCommand = "npx serve -s dist -l $PORT"
